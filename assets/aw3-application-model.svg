<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-labelledby="title desc">
  <title id="title">MRDVS application delivery model</title>
  <desc id="desc">AW3 is the target runtime for Depalletizing, Pallet Docking, Volume Measurement, and Slot Monitoring. Obstacle Avoidance is a camera application. LxCameraViewer and CameraSDK are shared tools.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1964FF"/><stop offset="1" stop-color="#15D1FF"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F2747" flood-opacity="0.10"/></filter>
  </defs>
  <rect x="1" y="1" width="818" height="318" rx="18" fill="#F6F9FF" stroke="#D7E3F4" stroke-width="2"/>
  <text x="30" y="34" fill="#0F2747" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Application delivery model</text>
  <text x="790" y="34" fill="#52708F" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12">Target architecture</text>

  <g filter="url(#shadow)">
    <rect x="24" y="54" width="772" height="152" rx="14" fill="#FFFFFF" stroke="#BFD1EA"/>
    <rect x="24" y="54" width="772" height="42" rx="14" fill="url(#header)"/>
    <path d="M24 82v14h772V82" fill="url(#header)"/>
    <text x="44" y="80" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">AW3 PLATFORM</text>
    <text x="776" y="80" fill="#FFFFFF" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12">Major platform releases</text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <rect x="42" y="113" width="170" height="54" rx="9" fill="#EAF0FF" stroke="#1964FF"/>
      <text x="127" y="145" fill="#173E78">Depalletizing</text>
      <rect x="230" y="113" width="170" height="54" rx="9" fill="#E8F5FF" stroke="#167DEB"/>
      <text x="315" y="145" fill="#173E78">Pallet Docking</text>
      <rect x="418" y="113" width="170" height="54" rx="9" fill="#E5F9FF" stroke="#10A8DA"/>
      <text x="503" y="145" fill="#173E78">Volume Measurement</text>
      <rect x="606" y="113" width="170" height="54" rx="9" fill="#E2FCFF" stroke="#15D1FF"/>
      <text x="691" y="145" fill="#173E78">Slot Monitoring</text>
    </g>
    <text x="410" y="190" fill="#52708F" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12">Application patches keep independent versions and declare AW3 compatibility.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="24" y="224" width="378" height="70" rx="12" fill="#FFFFFF" stroke="#BFD1EA"/>
    <rect x="38" y="238" width="132" height="42" rx="8" fill="#11386B"/>
    <text x="104" y="263" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">CAMERA APP</text>
    <text x="188" y="254" fill="#0F2747" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Obstacle Avoidance</text>
    <text x="188" y="274" fill="#52708F" font-family="Arial, Helvetica, sans-serif" font-size="11">Embedded application lifecycle</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="418" y="224" width="378" height="70" rx="12" fill="#FFFFFF" stroke="#BFD1EA"/>
    <rect x="432" y="238" width="132" height="42" rx="8" fill="#10A8DA"/>
    <text x="498" y="263" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">SHARED TOOLS</text>
    <text x="582" y="254" fill="#0F2747" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">LxCameraViewer</text>
    <text x="582" y="274" fill="#52708F" font-family="Arial, Helvetica, sans-serif" font-size="11">CameraSDK and diagnostics</text>
  </g>
</svg>
