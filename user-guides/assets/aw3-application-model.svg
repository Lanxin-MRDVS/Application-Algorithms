<svg xmlns="http://www.w3.org/2000/svg" width="820" height="344" viewBox="0 0 820 344" role="img" aria-labelledby="title desc">
  <title id="title">AW3 application installation</title>
  <desc id="desc">Volume Measurement requires only the AW3 installer, with frontend and backend. Slot Monitoring and Pallet Docking require the AW3 frontend and their own algorithm tar.gz, without the AW3 backend. Depalletizing retains its legacy delivery, and Obstacle Avoidance has a dedicated host application.</desc>
  <defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1964FF"/><stop offset="1" stop-color="#10BEE8"/></linearGradient></defs>
  <rect x="1" y="1" width="818" height="342" rx="18" fill="#F6F9FF" stroke="#D7E3F4" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="26" y="35" font-size="20" font-weight="700" fill="#0F2747">AW3 application installation</text>
    <rect x="24" y="53" width="772" height="40" rx="10" fill="url(#brand)"/>
    <text x="410" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="white">ONE SHARED AW3 INSTALLER</text>
    <rect x="24" y="107" width="248" height="122" rx="10" fill="white" stroke="#BFD1EA"/>
    <text x="148" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#173E78">Volume Measurement</text>
    <text x="148" y="160" text-anchor="middle" font-size="12" fill="#315476">AW3 frontend + backend</text>
    <text x="148" y="183" text-anchor="middle" font-size="12" fill="#315476">No separate algorithm package</text>
    <rect x="286" y="107" width="248" height="122" rx="10" fill="white" stroke="#BFD1EA"/>
    <text x="410" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#173E78">Slot Monitoring</text>
    <text x="410" y="160" text-anchor="middle" font-size="12" fill="#315476">AW3 frontend only</text>
    <text x="410" y="183" text-anchor="middle" font-size="12" fill="#315476">+ StockSync algorithm .tar.gz</text>
    <text x="410" y="206" text-anchor="middle" font-size="12" fill="#315476">Do not install the AW3 backend</text>
    <rect x="548" y="107" width="248" height="122" rx="10" fill="white" stroke="#BFD1EA"/>
    <text x="672" y="133" text-anchor="middle" font-size="16" font-weight="700" fill="#173E78">Pallet Docking</text>
    <text x="672" y="160" text-anchor="middle" font-size="12" fill="#315476">AW3 frontend only</text>
    <text x="672" y="183" text-anchor="middle" font-size="12" fill="#315476">+ SmartDocking algorithm .tar.gz</text>
    <text x="672" y="206" text-anchor="middle" font-size="12" fill="#315476">Do not install the AW3 backend</text>
    <text x="410" y="251" text-anchor="middle" font-size="12" fill="#52708F">AW3 hosts the shared installer. Each application owns its algorithm package.</text>
    <line x1="24" y1="266" x2="796" y2="266" stroke="#D7E3F4"/>
    <text x="26" y="289" font-size="12" fill="#315476">Depalletizing: legacy standalone delivery retained</text>
    <text x="434" y="289" font-size="12" fill="#315476">Obstacle Avoidance: dedicated host application</text>
    <text x="26" y="318" font-size="12" fill="#52708F">Shared tools: LxCameraViewer and CameraSDK</text>
  </g>
</svg>
