<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-labelledby="title desc">
  <title id="title">MRDVS platform and application overview</title>
  <desc id="desc">AW3 currently supports Pallet Docking, Volume Measurement and Slot Monitoring. Depalletizing uses a standalone package with AW3 migration planned. Obstacle Avoidance has a dedicated host application. LxCameraViewer and CameraSDK are shared tools. Package installation requirements are listed separately.</desc>
  <defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1964FF"/><stop offset="1" stop-color="#10BEE8"/></linearGradient></defs>
  <rect x="1" y="1" width="818" height="318" rx="18" fill="#F6F9FF" stroke="#D7E3F4" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="24" y="20" width="772" height="180" rx="12" fill="#FFFFFF" stroke="#BFD1EA"/>
    <rect x="24" y="20" width="772" height="44" rx="12" fill="url(#brand)"/>
    <path d="M24 52v12h772V52" fill="url(#brand)"/>
    <text x="42" y="48" font-size="18" font-weight="700" fill="#FFFFFF">AW3 PLATFORM</text>
    <text x="778" y="47" text-anchor="end" font-size="13" fill="#FFFFFF">Shared configuration and application interface</text>
    <g text-anchor="middle">
      <rect x="40" y="80" width="176" height="75" rx="9" fill="#F6F9FF" stroke="#879BB4" stroke-dasharray="5 4"/>
      <text x="128" y="109" font-size="15" font-weight="700" fill="#173E78">Depalletizing</text>
      <text x="128" y="134" font-size="12" fill="#52708F">AW3 migration planned</text>
      <rect x="228" y="80" width="176" height="75" rx="9" fill="#EAF0FF" stroke="#1964FF"/>
      <text x="316" y="109" font-size="15" font-weight="700" fill="#173E78">Pallet Docking</text>
      <text x="316" y="134" font-size="12" fill="#315476">SmartDocking</text>
      <rect x="416" y="80" width="176" height="75" rx="9" fill="#E8F5FF" stroke="#167DEB"/>
      <text x="504" y="109" font-size="15" font-weight="700" fill="#173E78">Volume Measurement</text>
      <text x="504" y="134" font-size="12" fill="#315476">TorusMetric</text>
      <rect x="604" y="80" width="176" height="75" rx="9" fill="#E5F9FF" stroke="#10A8DA"/>
      <text x="692" y="109" font-size="15" font-weight="700" fill="#173E78">Slot Monitoring</text>
      <text x="692" y="134" font-size="12" fill="#315476">StockSync</text>
    </g>
    <text x="42" y="181" font-size="12" fill="#52708F">Depalletizing currently uses its standalone package. Installation requirements differ by application.</text>
    <rect x="24" y="218" width="378" height="78" rx="12" fill="#FFFFFF" stroke="#BFD1EA"/>
    <rect x="24" y="230" width="4" height="54" rx="2" fill="#1964FF"/>
    <text x="42" y="249" font-size="16" font-weight="700" fill="#173E78">Obstacle Avoidance</text>
    <text x="42" y="276" font-size="13" fill="#52708F">Dedicated host application</text>
    <rect x="418" y="218" width="378" height="78" rx="12" fill="#FFFFFF" stroke="#BFD1EA"/>
    <rect x="418" y="230" width="4" height="54" rx="2" fill="#10BEE8"/>
    <text x="436" y="249" font-size="16" font-weight="700" fill="#173E78">Shared tools</text>
    <text x="436" y="276" font-size="13" fill="#52708F">LxCameraViewer · CameraSDK</text>
  </g>
</svg>
